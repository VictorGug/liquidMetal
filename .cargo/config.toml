# The bundled SDL2 sources ship a `cmake_minimum_required(VERSION 3.0)`, and the
# CMake on this box is 4.3, which removed compatibility with < 3.5 entirely.
# CMake 4.x honours this as an environment variable, so setting it here makes a
# plain `cargo build` work without the caller having to export anything.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

# Type-check the macOS half of the program from Linux.
#
# `--no-default-features` drops the bundled-SDL build, which is a C build targeting
# macOS and cannot run here; without it the build script fails long before rustc
# gets a chance to look at any Rust. Nothing is linked, so no macOS SDK is needed —
# but every `cfg(target_os = "macos")` path is compiled, which is the whole point.
#
#     rustup target add aarch64-apple-darwin
#     cargo check-mac
[alias]
check-mac = "check --target aarch64-apple-darwin --no-default-features"
